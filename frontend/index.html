<!DOCTYPE html>
<html>

<head>
    <title>Log In Page</title>
    <link href="styles/index.css" rel="stylesheet">
</head>

<body>
    <div class="front-page">
        <div class="SignInPageHeader">
            <img src="images/heading.png" class="header">
        </div>
        <div class="SignInPage">
            <div class="akinator-image-div">
                <a href="copyrights.html"><img src="images/akinator-genie-stand-alone-removebg-preview.png"
                        class="akinator-genie-stand-alone"></a>
            </div>
            <div class="container">
                <div class="form-card">
                    <h1><span>Sign</span> in</h1>

                    <form>
                        <label for="name">Name*</label>
                        <input type="text" id="name" placeholder="Enter your name" required />

                        <label for="roll">Roll Number*</label>
                        <input type="text" id="roll-number" placeholder="Enter your Roll Number" required />

                        <label for="email">Email*</label>
                        <input type="email" id="email" placeholder="Enter your email" required />

                        <label for="phone">Phone number*</label>
                        <div class="phone-input">
                            <span class="flag">🇮🇳</span>
                            <span class="code">+91</span>
                            <input type="tel" id="phone" placeholder="Enter your phone number" />
                        </div>

                        <button type="submit" class="submit">Next</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="scripts/index.js"></script>
</body>

</html>
